name: CI
on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # `npm ci` installs exactly from package-lock.json — reproducible,
      # and fails loudly if the lockfile is out of sync. Prefer it over
      # `npm install` in CI.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # The important one: proves the app builds with no SSR/window errors
      # from the client-only Plotly wrapper.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test
